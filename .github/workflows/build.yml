name: Build & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & unit tests (Windows)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore StarBridger.slnx

      - name: Build
        run: dotnet build StarBridger.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test StarBridger.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starbridger-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
